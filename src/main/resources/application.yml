server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: deodorant-reborn-api
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
