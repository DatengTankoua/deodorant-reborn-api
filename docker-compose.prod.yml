services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: deodorant-reborn-api

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

      JAVA_OPTS: "-Xms256m -Xmx512m"

    restart: always

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s